services:
  ai:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      AI_GRPC_LISTEN: 0.0.0.0:50051
    command: ["go", "run", ".", "-ai-service"]
    restart: unless-stopped

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      AI_GRPC_ADDRESS: ai:50051
    depends_on:
      - ai
    ports:
      - "8080:8080"
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    pids_limit: 128

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

